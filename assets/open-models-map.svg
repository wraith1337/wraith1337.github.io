<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Three 2026 open-weight models, compared by what is actually public</title><desc id="desc">DeepSeek V4 Flash 0731, DeepSeek V4.1 Flash, and Kimi K3 by release status, weights, license, scale, context, and practical deployment.</desc>
<rect width="1200" height="675" fill="#0b0e14"/><text x="64" y="70" fill="#e6e9ef" font-family="Arial,sans-serif" font-size="34" font-weight="700">Open weights ≠ open source</text><text x="64" y="108" fill="#8b93a3" font-family="Arial,sans-serif" font-size="20">What is actually public for three frontier model releases</text>
<g font-family="Arial,sans-serif"><rect x="54" y="150" width="340" height="430" rx="16" fill="#121724" stroke="#2b3549"/><text x="78" y="192" fill="#7ee0a3" font-size="22" font-weight="700">DeepSeek V4-Flash-0731</text><text x="78" y="228" fill="#e6e9ef" font-size="17">Official release · 31 Jul 2026</text><text x="78" y="268" fill="#e6e9ef" font-size="17">Weights: public</text><text x="78" y="300" fill="#e6e9ef" font-size="17">License: MIT</text><text x="78" y="332" fill="#e6e9ef" font-size="17">Model card: ~304B params</text><text x="78" y="364" fill="#e6e9ef" font-size="17">DSpark speculative decoding</text><text x="78" y="416" fill="#8b93a3" font-size="16">Practical read</text><text x="78" y="446" fill="#e6e9ef" font-size="16">Open and deployable, but still</text><text x="78" y="472" fill="#e6e9ef" font-size="16">far beyond a normal workstation.</text>
<rect x="430" y="150" width="340" height="430" rx="16" fill="#121724" stroke="#7ee0a3" stroke-width="2"/><text x="454" y="192" fill="#7ee0a3" font-size="22" font-weight="700">DeepSeek V4.1-Flash</text><text x="454" y="228" fill="#e6e9ef" font-size="17">Official release · 10 Sep 2026</text><text x="454" y="268" fill="#e6e9ef" font-size="17">Weights: public</text><text x="454" y="300" fill="#e6e9ef" font-size="17">License: MIT</text><text x="454" y="332" fill="#e6e9ef" font-size="17">552B MoE backbone</text><text x="454" y="364" fill="#e6e9ef" font-size="17">1M context · native vision</text><text x="454" y="396" fill="#e6e9ef" font-size="17">8B prefill / 16B decode active</text><text x="454" y="448" fill="#8b93a3" font-size="16">Practical read</text><text x="454" y="478" fill="#e6e9ef" font-size="16">Built for cheaper long-context</text><text x="454" y="504" fill="#e6e9ef" font-size="16">serving, not local-laptop use.</text>
<rect x="806" y="150" width="340" height="430" rx="16" fill="#121724" stroke="#2b3549"/><text x="830" y="192" fill="#7ee0a3" font-size="22" font-weight="700">Kimi K3</text><text x="830" y="228" fill="#e6e9ef" font-size="17">Official release · Jul 2026</text><text x="830" y="268" fill="#e6e9ef" font-size="17">Weights: public</text><text x="830" y="300" fill="#e6e9ef" font-size="17">License: custom Kimi K3</text><text x="830" y="332" fill="#e6e9ef" font-size="17">2.8T MoE · 104B active</text><text x="830" y="364" fill="#e6e9ef" font-size="17">1M context · native multimodal</text><text x="830" y="396" fill="#e6e9ef" font-size="17">16 of 896 experts selected</text><text x="830" y="448" fill="#8b93a3" font-size="16">Practical read</text><text x="830" y="478" fill="#e6e9ef" font-size="16">Open weights at data-center scale;</text><text x="830" y="504" fill="#e6e9ef" font-size="16">license has large-business terms.</text></g><line x1="54" y1="616" x2="1146" y2="616" stroke="#263044"/><text x="64" y="646" fill="#8b93a3" font-family="Arial,sans-serif" font-size="15">Sources: DeepSeek release/model cards; Moonshot AI Kimi K3 model card + license. Creator-reported specifications.</text></svg>
