name: Wraith Classical Arena Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "53 */6 * * *"   # safety net: restart the chain if it ever dies

concurrency:
  group: classical-chain
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout classical state (classical-state branch)
        uses: actions/checkout@v4
        with:
          ref: classical-state
          path: work
          token: ${{ secrets.GH_PAT }}

      - name: Checkout engine payload (runner branch)
        uses: actions/checkout@v4
        with:
          ref: runner
          path: payload
          token: ${{ secrets.GH_PAT }}

      - name: Checkout site (main branch)
        uses: actions/checkout@v4
        with:
          ref: main
          path: pages
          token: ${{ secrets.GH_PAT }}

      - name: Setup
        run: |
          python3 -m pip install --quiet python-chess backoff PyYAML requests rich
          cp -r payload/engines payload/books payload/squashfs-root payload/newlib work/
          chmod -R +x work/engines work/tournament_classical
          rm -f work/tournament_classical/.arena_stopped
          git -C work config user.email "wraith@arena.local"
          git -C work config user.name "Wraith Classical Arena"
          git -C work remote set-url origin "https://x-access-token:${GH_PAT}@github.com/wraith1337/wraith1337.github.io.git"
          git -C pages config user.email "wraith@arena.local"
          git -C pages config user.name "Wraith Classical Arena"
          git -C pages remote set-url origin "https://x-access-token:${GH_PAT}@github.com/wraith1337/wraith1337.github.io.git"
          echo "DRAIN_DEADLINE=$(( $(date +%s) + 18900 ))" >> "$GITHUB_ENV"

      - name: Run tournament with broadcaster
        env:
          TOUR_DIR: ${{ github.workspace }}/work/tournament_classical
          PAGES_DIR: ${{ github.workspace }}/pages
        run: |
          python3 work/tournament_classical/broadcaster_cloud.py > broadcaster.out 2>&1 &
          python3 work/tournament_classical/arena_cloud.py
          echo "arena exited rc=$?"

      - name: Final state push
        if: ${{ always() }}
        run: |
          git -C work add tournament_classical || true
          git -C work commit -q -m "state sync (job end)" || true
          git -C work push -q origin HEAD:classical-state || true

      - name: Dispatch next chained run
        if: ${{ success() }}
        run: |
          if [ -f work/tournament_classical/FINISHED.json ]; then
            echo "classical tournament finished - chain stops here"
            exit 0
          fi
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/wraith1337/wraith1337.github.io/actions/workflows/classical.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "next run dispatched"
